<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>iBay Plus — Data</title>
  <style>
    body {
      font: 14px/1.55 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #2c3a3f;
      background: #f6f8f9;
      max-width: 760px;
      margin: 0 auto;
      padding: 24px;
    }
    h1 { font-size: 20px; display: flex; align-items: center; gap: 10px; }
    h1 img { width: 28px; height: 28px; }
    h2 { font-size: 16px; margin-top: 28px; }
    .card {
      background: #fff;
      border: 1px solid #eceff1;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 16px;
    }
    button {
      padding: 8px 14px;
      border: 1px solid #009688;
      border-radius: 6px;
      background: #fff;
      color: #00796b;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      margin-right: 8px;
      margin-top: 6px;
    }
    button.danger { border-color: #e53935; color: #e53935; }
    button.primary { background: #009688; color: #fff; }
    textarea {
      width: 100%;
      min-height: 220px;
      padding: 10px;
      border: 1px solid #cfd8dc;
      border-radius: 6px;
      font: 12px/1.5 ui-monospace, Menlo, monospace;
    }
    #status { color: #2e7d32; margin-left: 8px; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; }
    td, th { border-bottom: 1px solid #eceff1; padding: 6px 8px; text-align: left; }
    th { color: #78909c; }
    input[type="file"] { margin-top: 6px; }
  </style>
</head>
<body>
  <h1><img src="../icons/icon48.png" alt=""> iBay Plus — Data</h1>

  <div class="card">
    <h2>Saved watchlist</h2>
    <table id="items">
      <thead>
        <tr><th>Item</th><th>Saved</th><th>Latest</th><th>Saved at</th></tr>
      </thead>
      <tbody></tbody>
    </table>
    <p id="empty" style="color:#78909c">Watchlist is empty.</p>
  </div>

  <div class="card">
    <h2>Export / Import / Reset</h2>
    <p>Back up your watchlist, notes and price history as JSON, or restore from a backup.</p>
    <button type="button" id="export">⬇ Export JSON</button>
    <label>
      <input type="file" id="import-file" accept="application/json,.json">
    </label>
    <button type="button" class="danger" id="clear-watchlist">🗑 Clear watchlist</button>
    <button type="button" class="danger" id="clear-all">⚠ Reset everything</button>
    <span id="status"></span>
  </div>

  <script src="../content/common.js"></script>
  <script src="options.js"></script>
</body>
</html>
